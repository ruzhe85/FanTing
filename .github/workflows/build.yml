name: Build OmniBeatP APK

"on":
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "发布模式: ci = 测试版(默认, 固定 tag ci), formal = 正式版 (vX.Y.Z)"
        required: false
        default: ci
        type: choice
        options:
          - ci
          - formal

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # 签名信息由 build.gradle.kts 从环境变量读取；keystore 文件在下面的步骤里从 Secrets 解码出来。
    env:
      OMNIBEATP_KEYSTORE: keystore/omnibeatp.jks
      OMNIBEATP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      OMNIBEATP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      OMNIBEATP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties 指定 toolchainVersion=21，
      # 所以这里必须是 JDK 21（低于 21 会让 Gradle 去 Foojay 下载工具链，构建变慢甚至失败）。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 该 action 默认的 packages 里含 "tools"，而这个包已被 Google 从 sdkmanager 仓库移除，
          # 导致它直接以退出码 1 失败。显式覆盖，只保留 platform-tools。
          packages: platform-tools

      # compileSdk = release(37)：37 若尚未进入稳定频道，需要 --channel=3 才能装到。
      - name: Install SDK platform 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" || sdkmanager --channel=3 "platforms;android-37"
          # 不显式指定 build-tools：交给 AGP 按 compileSdk 自行选择，避免版本不存在导致失败。

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: Decode signing keystore from secrets
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/omnibeatp.jks
          ls -l keystore/

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # push：commit message 含 [release] / 正式版 → formal，否则 ci。
      # workflow_dispatch：用输入的 mode。
      - name: Resolve publish mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            MSG=$(git log -1 --format=%s)
            if echo "$MSG" | grep -qiE '\[release\]|正式版'; then
              MODE=formal
            else
              MODE=ci
            fi
          fi
          echo "mode=$MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew assembleGithubRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          ls -la app/build/outputs/apk/github/release/
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/github/release/*.apk | head -8

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: omnibeatp-apk
          path: app/build/outputs/apk/github/release/*.apk
          retention-days: 30

      # 测试版：固定 tag "ci"，始终标记为 prerelease，不会成为 GitHub Latest。
      - name: Publish CI release
        if: steps.mode.outputs.mode == 'ci'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          APK_DIR=app/build/outputs/apk/github/release
          VERSION_NAME=$(grep -oP 'app.versionName=\K.*' gradle.properties | head -1)
          SHA=$(git rev-parse --short HEAD)

          cd "$APK_DIR"
          for apk in *.apk; do
            mv "$apk" "OmniBeatP-ci.apk"
          done
          ls -la

          cd "$GITHUB_WORKSPACE"
          gh release delete ci --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git tag -d ci 2>/dev/null || true
          git push origin ":refs/tags/ci" 2>/dev/null || true

          gh release create ci \
            --repo "$GITHUB_REPOSITORY" \
            --title "OmniBeatP CI Build" \
            --prerelease \
            --notes "CI build (${VERSION_NAME}) from commit \`${SHA}\` — 测试版，非正式发布。" \
            "${APK_DIR}/OmniBeatP-ci.apk"

          echo "Published CI release (tag ci)"

      # 正式版：tag v{versionName}，成为 Latest。
      - name: Publish formal release
        if: steps.mode.outputs.mode == 'formal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          APK_DIR=app/build/outputs/apk/github/release
          VERSION_NAME=$(grep -oP 'app.versionName=\K.*' gradle.properties | head -1)
          TAG="v${VERSION_NAME}"

          cd "$APK_DIR"
          for apk in *.apk; do
            mv "$apk" "OmniBeatP-${VERSION_NAME}.apk"
          done
          ls -la

          cd "$GITHUB_WORKSPACE"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OmniBeatP ${VERSION_NAME}" \
            --generate-notes \
            "${APK_DIR}/OmniBeatP-${VERSION_NAME}.apk"

          echo "Published release $TAG"
